name: Pre-Deployment Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-deployment-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ./LawnBudAI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================================================
      # GATE 0: Secret Scanning (The Correct Way for the Action)
      # ========================================================================
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        id: trufflehog
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --format sarif --output ${{ github.workspace }}/trufflehog.sarif

      # Guarantee the SARIF file exists even when the scan finds nothing or errors out
      - name: Ensure SARIF file exists
        if: always()
        run: |
          SARIF="${GITHUB_WORKSPACE}/trufflehog.sarif"
          if [ ! -f "$SARIF" ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"TruffleHog","version":"3.0.0","informationUri":"https://github.com/trufflesecurity/trufflehog","rules":[]}},"results":[]}]}' > "$SARIF"
          fi

      - name: Upload Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trufflehog.sarif


      # ========================================================================
      # ENVIRONMENT & DB LINTING
      # ========================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lint database schema (Splinter)
        id: splinter
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db lint --linked --level warning --schema public
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        continue-on-error: true 

      # ========================================================================
      # TESTING & TYPES
      # ========================================================================
      - name: Check TypeScript types
        id: types
        run: yarn types:check
        continue-on-error: true

      - name: Run unit & contract tests
        id: tests
        run: yarn testFinal --maxWorkers=2
        continue-on-error: true

      # ========================================================================
      # FINAL GATE SUMMARY (The Dashboard)
      # ========================================================================
      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 🛡️ LawnBudAI Quality Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Secret Scan (TruffleHog) | ${{ steps.trufflehog.outcome == 'success' && '✅ Pass' || '⚠️ Issues Found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ DB Lint (Splinter) | ${{ steps.splinter.outcome == 'success' && '✅ Clean' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟦 Type Safety | ${{ steps.types.outcome == 'success' && '✅ Valid' || '❌ Drift Detected' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test Suite | ${{ steps.tests.outcome == 'success' && '✅ All Passed' || '❌ Regressions Found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the **Security** tab for detailed secret findings." >> $GITHUB_STEP_SUMMARY

      # Actual block for the 'deploy' job (Fail if critical gates didn't pass)
      - name: Final Validation
        run: |
          if [[ "${{ steps.tests.outcome }}" != "success" ]]; then
            echo "Critical tests failed. Blocking deployment."
            exit 1
          fi
